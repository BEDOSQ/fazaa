<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فزعة — مساعدة على الطريق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0B0F1A;--bg2:#111827;--bg3:#1C2333;--bg4:#242D42;--bg5:#2D3748;--or:#E8500A;--gr:#10B981;--re:#EF4444;--am:#F59E0B;--bl:#3B82F6;--pu:#8B5CF6;--tx:#F1F5F9;--mu:#94A3B8;--mu2:#64748B;--br:rgba(255,255,255,0.07);--brs:rgba(255,255,255,0.14);}
html,body{height:100%;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;}
*::-webkit-scrollbar{width:3px;}*::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px;}
.h{display:none!important;}
.f{display:flex;}.fc{flex-direction:column;}.ac{align-items:center;}.jb{justify-content:space-between;}
.g8{gap:8px;}.g12{gap:12px;}
.f11{font-size:11px;}.f12{font-size:12px;}.f13{font-size:13px;}.f14{font-size:14px;}.f16{font-size:16px;}.f18{font-size:18px;}.f22{font-size:22px;}
.w5{font-weight:500;}.w7{font-weight:700;}
.tor{color:var(--or);}.tgr{color:var(--gr);}.tre{color:var(--re);}.tam{color:var(--am);}.tbl{color:var(--bl);}.tmu{color:var(--mu);}
.mb4{margin-bottom:4px;}.mb8{margin-bottom:8px;}.mb12{margin-bottom:12px;}.mb14{margin-bottom:14px;}.mb16{margin-bottom:16px;}
.tc{text-align:center;}
@keyframes fi{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes pi{0%,100%{box-shadow:0 0 0 4px rgba(16,185,129,.2);}50%{box-shadow:0 0 0 12px rgba(16,185,129,.03);}}
@keyframes po{0%,100%{box-shadow:0 0 0 4px rgba(232,80,10,.25);}50%{box-shadow:0 0 0 14px rgba(232,80,10,.04);}}
@keyframes sp{to{transform:rotate(360deg);}}
@keyframes ni{from{transform:translateY(-100%);}to{transform:translateY(0);}}
@keyframes pb{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.fi{animation:fi .3s ease;}
.spin{width:30px;height:30px;border:3px solid var(--bg4);border-top-color:var(--or);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto;}
.card{background:var(--bg3);border-radius:14px;border:1px solid var(--br);padding:14px;margin-bottom:12px;}
.csm{background:var(--bg4);border-radius:9px;padding:10px 12px;}
.cor{background:rgba(232,80,10,.08);border:1px solid rgba(232,80,10,.25);}
.cgr{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.bgr{background:rgba(16,185,129,.15);color:#6EE7B7;}.bre{background:rgba(239,68,68,.15);color:#FCA5A5;}
.bam{background:rgba(245,158,11,.15);color:#FCD34D;}.bbl{background:rgba(59,130,246,.15);color:#93C5FD;}
.bor{background:rgba(232,80,10,.15);color:#FDBA74;}
.btn{border:none;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Tajawal',sans-serif;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn:active{transform:scale(.97);}
.bfw{width:100%;}
.bor2{background:var(--or);color:white;}.bor2:hover{background:#d4460a;}
.bgr2{background:var(--gr);color:white;}
.bre2{background:var(--re);color:white;}
.bdk{background:var(--bg4);color:var(--tx);}.bdk:hover{background:var(--bg5);}
.bbl2{background:var(--bl);color:white;}
.bgh{background:transparent;color:var(--mu);border:1px solid var(--br);}
.bsm{padding:7px 12px;font-size:12px;}
.blg{padding:14px;font-size:15px;}
.inp{background:var(--bg4);border:1px solid var(--br);border-radius:9px;padding:10px 14px;color:var(--tx);font-size:13px;font-family:'Tajawal',sans-serif;width:100%;outline:none;transition:border .2s;}
.inp:focus{border-color:rgba(232,80,10,.5);}
.inp::placeholder{color:var(--mu2);}
.lbl{font-size:12px;color:var(--mu);margin-bottom:5px;}
.av{display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:600;flex-shrink:0;}
.av36{width:36px;height:36px;font-size:13px;}.av44{width:44px;height:44px;font-size:15px;}.av60{width:60px;height:60px;font-size:20px;}
.avor{background:rgba(232,80,10,.15);color:var(--or);}
.avgr{background:rgba(16,185,129,.15);color:#6EE7B7;}
.avbl{background:rgba(59,130,246,.15);color:#93C5FD;}
.avpu{background:rgba(139,92,246,.15);color:#C4B5FD;}
.tgl{position:relative;width:46px;height:26px;cursor:pointer;}
.tgl input{display:none;}
.tgl-t{position:absolute;inset:0;border-radius:13px;background:#374151;transition:.3s;}
.tgl input:checked+.tgl-t{background:var(--gr);}
.tgl-h{position:absolute;width:20px;height:20px;background:white;border-radius:50%;top:3px;right:3px;transition:.3s;}
.tgl input:checked~.tgl-h{right:auto;left:3px;}
.mbox{background:var(--bg2);border-radius:13px;border:1px solid var(--br);position:relative;overflow:hidden;}
.msvg{position:absolute;inset:0;opacity:.13;pointer-events:none;}
.mpin{position:absolute;transform:translate(-50%,-100%);text-align:center;pointer-events:none;transition:top .8s ease,left .8s ease;}
.mpd{width:16px;height:16px;border-radius:50%;border:3px solid white;margin:auto;}
.mpd.or{background:var(--or);animation:po 1.5s infinite;}
.mpd.gr{background:var(--gr);animation:pi 1.5s infinite;}
.mpd.bl{background:var(--bl);}
.mpl{font-size:10px;color:white;padding:2px 6px;border-radius:5px;margin-top:4px;white-space:nowrap;}
.mpl.or{background:rgba(232,80,10,.9);}
.mpl.gr{background:rgba(16,185,129,.9);}
.mpl.bl{background:rgba(59,130,246,.9);}
.ddot{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid;cursor:pointer;transform:translate(-50%,-50%);transition:top .6s ease,left .6s ease;}
.ddot.av2{background:var(--gr);border-color:#6EE7B7;box-shadow:0 0 0 3px rgba(16,185,129,.2);}
.ddot.bz{background:var(--am);border-color:#FCD34D;box-shadow:0 0 0 3px rgba(245,158,11,.2);}
.ddot.of{background:#475569;border-color:#64748B;}
.topbar{background:var(--bg2);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--br);flex-shrink:0;}
.btmbar{background:var(--bg2);border-top:1px solid var(--br);display:flex;flex-shrink:0;}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 4px;border:none;background:transparent;color:var(--mu);cursor:pointer;font-size:10px;font-family:'Tajawal',sans-serif;transition:color .2s;position:relative;}
.bnav i{font-size:19px;}.bnav.on{color:var(--or);}
.nbadge{position:absolute;top:5px;right:calc(50% - 16px);background:var(--re);color:white;border-radius:10px;padding:1px 5px;font-size:9px;animation:pb 1s infinite;}
.sidebar{width:220px;background:var(--bg2);border-left:1px solid var(--br);display:flex;flex-direction:column;flex-shrink:0;height:100%;}
.slogo{padding:18px 16px;border-bottom:1px solid var(--br);}
.snav-list{flex:1;padding:10px 0;overflow-y:auto;}
.snav{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;color:var(--mu);font-size:13px;transition:all .2s;border-right:3px solid transparent;}
.snav:hover{background:var(--bg3);color:var(--tx);}.snav.on{background:var(--bg3);color:var(--or);border-right-color:var(--or);}
.snav i{font-size:17px;flex-shrink:0;}
.sbar{display:flex;gap:3px;margin-bottom:16px;}
.sbi{flex:1;height:4px;background:var(--bg4);border-radius:2px;transition:background .4s;}.sbi.dn{background:var(--or);}
.scg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px;}
.sc{background:var(--bg3);border:2px solid transparent;border-radius:13px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .2s;}
.sc:hover{border-color:rgba(232,80,10,.35);}.sc.sl{border-color:var(--or);background:rgba(232,80,10,.08);}
.popt{border:2px solid var(--br);border-radius:12px;padding:14px;cursor:pointer;transition:all .2s;margin-bottom:10px;}
.popt.sl{border-color:var(--or);background:rgba(232,80,10,.06);}
.pchk{width:20px;height:20px;border-radius:50%;border:2px solid var(--br);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stcard{background:var(--bg3);border-radius:12px;border:1px solid var(--br);padding:14px;text-align:center;}
.stnum{font-size:24px;font-weight:700;margin-bottom:3px;}.stlbl{font-size:11px;color:var(--mu);}
.pbar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.pfill{height:100%;border-radius:3px;background:var(--or);transition:width .7s;}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;}
.pdot.on{background:var(--gr);box-shadow:0 0 0 3px rgba(16,185,129,.3);}.pdot.of{background:#475569;}
.slbl{font-size:11px;color:var(--mu);letter-spacing:.5px;margin-bottom:10px;font-weight:500;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{font-size:11px;color:var(--mu);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--br);text-align:right;}
.tbl td{padding:10px;border-bottom:1px solid var(--br);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}.tbl tr:hover td{background:rgba(255,255,255,.02);}
.modal-ov{display:none;position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:20px;}
.modal-ov.open{display:flex;}.modal{background:var(--bg3);border-radius:18px;border:1px solid var(--br);padding:20px;width:100%;max-width:360px;}
.notif-bar{position:absolute;top:0;left:0;right:0;background:rgba(239,68,68,.95);padding:12px 16px;z-index:100;display:none;border-radius:0 0 14px 14px;animation:ni .3s ease;}
.notif-bar.show{display:flex;align-items:center;justify-content:space-between;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(16,185,129,.95);color:white;padding:10px 20px;border-radius:24px;font-size:13px;font-family:'Tajawal',sans-serif;z-index:9999;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;}
#app-root{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.pframe{width:420px;height:860px;background:var(--bg);border-radius:28px;border:1px solid var(--brs);display:flex;flex-direction:column;overflow:hidden;position:relative;}
.aframe{width:100%;height:100vh;background:var(--bg);display:flex;overflow:hidden;}
.pc{flex:1;overflow-y:auto;padding:16px;}
@media(max-width:480px){#app-root{align-items:flex-start;}.pframe{width:100%;height:100vh;border-radius:0;border:none;}}
</style>
</head>
<body>
<div id="app-root"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ═══════════════════════════════════════════
   SUPABASE CONFIG
═══════════════════════════════════════════ */
const SB_URL = 'https://vlzdynppigovmvcugtkq.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsemR5bnBwaWdvdm12Y3VndGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjAwODUsImV4cCI6MjA5NTM5NjA4NX0.EgP_alBw055bG62c0TysVyxzhkAfbB8GtBHd4tXOQFQ';
const sb = createClient(SB_URL, SB_KEY);

/* ═══════════════════════════════════════════
   REALTIME CHANNELS
═══════════════════════════════════════════ */
let realtimeChannel = null;

function subscribeRealtime() {
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('fazaa-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'requests'}, payload => {
      console.log('RT requests:', payload);
      onRequestChanged(payload);
    })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'users'}, payload => {
      console.log('RT users:', payload);
      onUserChanged(payload);
    })
    .subscribe(status => console.log('Realtime:', status));
}

function onRequestChanged(payload) {
  const req = payload.new || payload.old;
  if(S.role === 'client' && _activeReqId === req.id) {
    if(req.status === 'assigned' && req.driver_id) {
      sbGetDriver(req.driver_id).then(driver => { if(driver) showDriverAccepted(driver); });
    }
    if(req.status === 'completed') { toast('✅ تمت الخدمة!'); _activeReqId = null; clPage('home'); }
  }
  if(S.role === 'driver') { updateDriverBadge(); showDriverNotifFromRT(req); }
  if(S.role === 'admin') { if(ADMIN_PAGE==='dashboard') adminNav('dashboard'); if(ADMIN_PAGE==='requests') adminNav('requests'); }
}

function onUserChanged(payload) {
  const u = payload.new;
  if(S.role === 'admin') {
    const dot = document.getElementById('adot_'+u.id);
    if(dot && u.lat && u.lng) {
      const [x,y] = ll2xy(u.lat, u.lng);
      dot.style.left = x+'%'; dot.style.top = y+'%';
      dot.className = 'ddot ' + (u.available ? 'av2' : 'bz');
    }
    updateAdminStats();
    const pin = document.getElementById('drvpin');
    if(pin && _activeReqId) {
      sbGetRequest(_activeReqId).then(req => {
        if(req && req.driver_id === u.id && u.lat && u.lng) {
          const [x,y] = ll2xy(u.lat, u.lng);
          pin.style.left = x+'%'; pin.style.top = y+'%';
        }
      });
    }
  }
  if(S.role === 'client' && _activeReqId) {
    const pin = document.getElementById('drvpin');
    if(pin) {
      sbGetRequest(_activeReqId).then(req => {
        if(req && req.driver_id === u.id && u.lat && u.lng) {
          const [x,y] = ll2xy(u.lat, u.lng);
          pin.style.left = x+'%'; pin.style.top = y+'%';
        }
      });
    }
  }
}

/* ═══════════════════════════════════════════
   SUPABASE DB HELPERS
═══════════════════════════════════════════ */
async function sbLogin(email, pass, role) {
  const { data, error } = await sb.from('users').select('*').eq('email', email).eq('password', pass).eq('role', role).single();
  if(error || !data) return null;
  return data;
}
async function sbRegister(user) {
  const { data, error } = await sb.from('users').insert(user).select().single();
  if(error) throw error;
  return data;
}
async function sbGetUser(id) {
  const { data } = await sb.from('users').select('*').eq('id', id).single();
  return data;
}
async function sbGetDriver(id) {
  return sbGetUser(id);
}
async function sbGetDrivers() {
  const { data } = await sb.from('users').select('*').eq('role','driver');
  return data || [];
}
async function sbGetClients() {
  const { data } = await sb.from('users').select('*').eq('role','client');
  return data || [];
}
async function sbGetRequests() {
  const { data } = await sb.from('requests').select('*').order('created_at',{ascending:false});
  return data || [];
}
async function sbGetRequest(id) {
  const { data } = await sb.from('requests').select('*').eq('id', id).single();
  return data;
}
async function sbGetMyRequests(clientId) {
  const { data } = await sb.from('requests').select('*').eq('client_id', clientId).order('created_at',{ascending:false});
  return data || [];
}
async function sbGetPendingRequests() {
  const { data } = await sb.from('requests').select('*').eq('status','pending').order('created_at',{ascending:false});
  return data || [];
}
async function sbGetDriverTrips(driverId) {
  const { data } = await sb.from('requests').select('*').eq('driver_id', driverId).order('created_at',{ascending:false});
  return data || [];
}
async function sbCreateRequest(req) {
  const { data, error } = await sb.from('requests').insert(req).select().single();
  if(error) throw error;
  return data;
}
async function sbUpdateRequest(id, patch) {
  const { data } = await sb.from('requests').update(patch).eq('id', id).select().single();
  return data;
}
async function sbUpdateUser(id, patch) {
  const { data } = await sb.from('users').update(patch).eq('id', id).select().single();
  return data;
}
async function sbDeleteUser(id) {
  await sb.from('users').delete().eq('id', id);
}

/* ═══════════════════════════════════════════
   SESSION
═══════════════════════════════════════════ */
let S = {user:null, role:null};
let _activeReqId = null;
let ORDER = {svc:null,icon:null,price:0,note:'',lat:null,lng:null,addr:'',pay:null,step:1};

function saveSession() { try{ localStorage.setItem('fz_sess', JSON.stringify(S)); }catch(e){} }
function loadSession() { try{ const s=JSON.parse(localStorage.getItem('fz_sess')); if(s?.user){S=s;return true;} }catch(e){} return false; }
function logout() { S={user:null,role:null}; localStorage.removeItem('fz_sess'); if(realtimeChannel) sb.removeChannel(realtimeChannel); render(); }

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
let toastT = null;
function toast(msg, dur=2500) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'), dur);
}

function mapSVG(w,h) {
  return `<svg class="msvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="0" y1="${h*.5}" x2="${w}" y2="${h*.5}" stroke="#4A90D9" stroke-width="4"/>
    <line x1="0" y1="${h*.27}" x2="${w}" y2="${h*.73}" stroke="#4A90D9" stroke-width="2.5"/>
    <line x1="${w*.5}" y1="0" x2="${w*.5}" y2="${h}" stroke="#4A90D9" stroke-width="2.5"/>
    <line x1="0" y1="${h*.14}" x2="${w}" y2="${h*.14}" stroke="#4A90D9" stroke-width="1"/>
    <line x1="0" y1="${h*.86}" x2="${w}" y2="${h*.86}" stroke="#4A90D9" stroke-width="1"/>
    <line x1="${w*.25}" y1="0" x2="${w*.25}" y2="${h}" stroke="#4A90D9" stroke-width="1"/>
    <line x1="${w*.75}" y1="0" x2="${w*.75}" y2="${h}" stroke="#4A90D9" stroke-width="1"/>
    <rect x="${w*.12}" y="${h*.16}" width="${w*.13}" height="${h*.14}" rx="3" fill="#1C2333" opacity=".75"/>
    <rect x="${w*.62}" y="${h*.54}" width="${w*.15}" height="${h*.15}" rx="3" fill="#1C2333" opacity=".75"/>
    <rect x="${w*.36}" y="${h*.65}" width="${w*.11}" height="${h*.18}" rx="3" fill="#1C2333" opacity=".75"/>
  </svg>`;
}

function ll2xy(lat, lng) {
  const x = Math.min(88, Math.max(10, ((lng - 38.5) / 2) * 100));
  const y = Math.min(88, Math.max(10, ((22 - lat) / 1.5) * 100));
  return [x, y];
}

/* ═══════════════════════════════════════════
   ROUTER
═══════════════════════════════════════════ */
function render() {
  const root = document.getElementById('app-root');
  root.innerHTML = '';
  if(S.role==='admin') { renderAdmin(root); subscribeRealtime(); }
  else if(S.role==='driver') { renderDriver(root); subscribeRealtime(); startDriverGPS(); }
  else if(S.role==='client') { renderClient(root); subscribeRealtime(); }
  else renderChoice(root);
}

/* ═══════════════════════════════════════════
   CHOICE / LOGIN / REGISTER
═══════════════════════════════════════════ */
function renderChoice(root) {
  root.innerHTML = `
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;width:100%;padding:20px;">
    <div style="width:56px;height:56px;background:var(--or);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px;">🚗</div>
    <div style="font-size:28px;font-weight:800;color:var(--or);margin-bottom:4px;">فزعة</div>
    <div style="font-size:13px;color:var(--mu);margin-bottom:36px;">مساعدة على الطريق</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:560px;width:100%;">
      ${[['client','👤','عميل','اطلب خدمة','rgba(59,130,246,.5)'],['driver','🚛','سائق','استقبل الطلبات','rgba(16,185,129,.5)'],['admin','🛡️','إدارة','لوحة التحكم','rgba(139,92,246,.5)']].map(([r,ic,t,s,c])=>`
      <div onclick="showLogin('${r}')" style="background:var(--bg3);border:1px solid var(--br);border-radius:16px;padding:24px 14px;text-align:center;cursor:pointer;transition:all .2s;" onmouseover="this.style.borderColor='${c}'" onmouseout="this.style.borderColor='var(--br)'">
        <div style="font-size:36px;margin-bottom:10px;">${ic}</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:4px;">${t}</div>
        <div style="font-size:11px;color:var(--mu);">${s}</div>

window.doReg = async function(role) {
  const name=document.getElementById('rn').value.trim();
  const email=document.getElementById('re').value.trim();
  const phone=document.getElementById('rph').value.trim();
  const p1=document.getElementById('rp1').value;
  const p2=document.getElementById('rp2').value;
  const err=document.getElementById('rerr');
  if(!name||!email||!p1){err.style.display='block';err.textContent='يرجى تعبئة جميع الحقول';return;}
  if(p1!==p2){err.style.display='block';err.textContent='كلمة المرور غير متطابقة';return;}
  const btn=document.getElementById('regbtn'); btn.textContent='جارٍ الإنشاء...'; btn.disabled=true;
  try {
    const u={name,email,phone,role,password:p1,rating:5.0,trips:0,available:true,lat:21.4858,lng:39.1925};
    if(role==='driver'){u.svc=document.getElementById('rsv')?.value||'سطحة';u.plate=document.getElementById('rpl')?.value||'';}
    const user = await sbRegister(u);
    S={user,role}; saveSession(); render();
  } catch(e) {
    btn.textContent='إنشاء الحساب'; btn.disabled=false;
    err.style.display='block'; err.textContent='البريد مسجل مسبقاً أو حدث خطأ';
  }
};

    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(p=>update(p.coords.latitude,p.coords.longitude),()=>{
        const activeReq=null;
        let lat=S.user.lat||21.488,lng=S.user.lng||39.193;

        <div style="width:36px;height:36px;background:var(--or);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">🚗</div>
        <div><div class="w7 f14 tor">فزعة</div><div class="f11 tmu">لوحة الإدارة</div></div>
      </div>
      <nav class="snav-list">
        <div class="snav on" id="sn-dashboard" onclick="adminNav('dashboard')"><i class="ti ti-layout-dashboard"></i><span>لوحة التحكم</span></div>
        <div class="snav" id="sn-map" onclick="adminNav('map')"><i class="ti ti-map-2"></i><span>الخريطة الحية</span></div>
        <div class="snav" id="sn-requests" onclick="adminNav('requests')"><i class="ti ti-bell"></i><span>الطلبات</span></div>
        <div class="snav" id="sn-drivers" onclick="adminNav('drivers')"><i class="ti ti-steering-wheel"></i><span>السائقون</span></div>
        <div class="snav" id="sn-clients" onclick="adminNav('clients')"><i class="ti ti-users"></i><span>العملاء</span></div>
        <div class="snav" id="sn-profile" onclick="adminNav('profile')"><i class="ti ti-settings"></i><span>الإعدادات</span></div>
      </nav>
      <div style="padding:14px;border-top:1px solid var(--br);">
        <div class="f ac g10 mb10"><div class="av av36 avpu">${S.user.name[0]}</div><div><div class="f12 w5">${S.user.name}</div><div class="f11 tmu">مشرف</div></div></div>
        <button class="btn bgh bfw bsm" onclick="logout()"><i class="ti ti-logout"></i> خروج</button>
      </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <div class="topbar">
        <div class="f16 w7" id="aptitle">لوحة التحكم</div>
        <div class="f ac g8"><span class="pdot on"></span><span class="f12 tmu">مباشر</span><span class="f12 tmu" id="atime"></span></div>
      </div>
      <div class="pc" id="apc" style="flex:1;overflow-y:auto;"></div>
    </div>
  </div>`;
  adminNav('dashboard');
  setInterval(()=>{const e=document.getElementById('atime');if(e)e.textContent=new Date().toLocaleTimeString('ar-SA');},1000);
}

window.adminNav = function(pg) {
  ADMIN_PAGE=pg;
  document.querySelectorAll('.snav').forEach(n=>n.classList.remove('on'));
  const sn=document.getElementById('sn-'+pg);if(sn)sn.classList.add('on');
  const titles={dashboard:'لوحة التحكم',map:'الخريطة الحية',requests:'الطلبات',drivers:'السائقون',clients:'العملاء',profile:'إعدادات الحساب'};
  const t=document.getElementById('aptitle');if(t)t.textContent=titles[pg]||'';
  const pc=document.getElementById('apc');if(!pc)return;
  pc.innerHTML=`<div class="spin" style="margin-top:40px;"></div>`;
  if(pg==='dashboard') buildAdminDash(pc);
  else if(pg==='map') buildAdminMap(pc);
  else if(pg==='requests') buildAdminReqs(pc);
  else if(pg==='drivers') buildAdminDrivers(pc);
  else if(pg==='clients') buildAdminClients(pc);
  else if(pg==='profile') buildAdminProfile(pc);
};

function updateAdminStats() {
  if(ADMIN_PAGE==='dashboard') adminNav('dashboard');
}

function buildAdminDash(pc) {
  Promise.all([sbGetRequests(), sbGetDrivers(), sbGetClients()]).then(([reqs,drivers,clients])=>{
    const pend=reqs.filter(r=>r.status==='pending').length;
    const active=reqs.filter(r=>r.status==='assigned').length;
    const done=reqs.filter(r=>r.status==='completed').length;
    const rev=reqs.filter(r=>r.status==='completed').reduce((s,r)=>s+r.price,0);
    const avail=drivers.filter(d=>d.available).length;
    pc.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;" class="fi">
      <div class="stcard"><div class="stnum tre">${pend}</div><div class="stlbl">انتظار</div></div>
      <div class="stcard"><div class="stnum tam">${active}</div><div class="stlbl">نشط</div></div>
      <div class="stcard"><div class="stnum tgr">${done}</div><div class="stlbl">مكتمل</div></div>
      <div class="stcard"><div class="stnum tor">${rev}</div><div class="stlbl">إيراد (ر)</div></div>
      <div class="stcard"><div class="stnum tbl">${avail}</div><div class="stlbl">سائق متاح</div></div>
      <div class="stcard"><div class="stnum" style="color:var(--pu);">${clients.length}</div><div class="stlbl">عميل</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <div class="slbl">آخر الطلبات</div>
        ${reqs.slice(0,6).map(r=>{
          const sm={pending:'bre انتظار',assigned:'bbl نشط',completed:'bgr مكتمل',cancelled:'bam ملغي'};
          const [c,t]=(sm[r.status]||'bam انتظار').split(' ');
          return `<div class="csm mb8 fi f jb ac"><div><div class="f13 w5">${r.icon||'🔧'} ${r.svc}</div><div class="f11 tmu">${r.client_name}</div></div><span class="badge ${c}">${t}</span></div>`;
        }).join('')||'<div class="f12 tmu">لا توجد طلبات</div>'}
      </div>
      <div>
        <div class="slbl">السائقون</div>
        ${drivers.slice(0,6).map(d=>`<div class="csm mb8 fi f jb ac"><div class="f ac g8"><span class="pdot ${d.available?'on':'of'}"></span><div><div class="f13 w5">${d.name}</div><div class="f11 tmu">${d.svc||''}</div></div></div><span class="badge ${d.available?'bgr':'bam'}">${d.available?'متاح':'مشغول'}</span></div>`).join('')}
      </div>
    </div>`;
  });
}

function buildAdminMap(pc) {
  Promise.all([sbGetDrivers(), sbGetRequests()]).then(([drivers, allReqs])=>{
    const reqs=allReqs.filter(r=>r.status==='pending'||r.status==='assigned');
    pc.innerHTML=`
    <div class="f jb ac mb12">
      <div class="f ac g8 f12"><span class="pdot on"></span><span>متاح</span><span style="color:var(--am);">●</span><span>مشغول</span><span style="color:var(--re);">●</span><span>طلب</span></div>
      <button class="btn bdk bsm" onclick="getAdminGPS()"><i class="ti ti-current-location"></i> موقعي</button>
    </div>
    <div class="mbox mb14" style="height:360px;" id="adminmap">
      ${mapSVG(700,360)}
      ${drivers.map((d,i)=>{
        const top=15+((i*137+23)%65)+'%', left=10+((i*83+17)%80)+'%';
        return `<div class="ddot ${d.available?'av2':'bz'}" id="adot_${d.id}" style="top:${top};left:${left};" onclick="adminDotInfo('${d.id}')" title="${d.name}"></div>`;
      }).join('')}
      ${reqs.map((r,i)=>`<div style="position:absolute;top:${25+((i*97+13)%50)+'%'};left:${20+((i*71+9)%60)+'%'};transform:translate(-50%,-50%);cursor:pointer;" title="${r.client_name}"><div style="width:14px;height:14px;border-radius:50%;background:var(--re);border:2px solid #FCA5A5;box-shadow:0 0 0 5px rgba(239,68,68,.2);animation:po 1.4s infinite;"></div></div>`).join('')}
      <div class="mpin" id="adminmepin" style="top:50%;left:50%;display:none;"><div class="mpd bl"></div><div class="mpl bl">أنا</div></div>
      <div id="amtt" style="display:none;position:absolute;background:var(--bg2);border:1px solid var(--br);border-radius:8px;padding:8px 12px;font-size:12px;z-index:10;pointer-events:none;max-width:180px;"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;">
      ${drivers.map(d=>`<div class="csm f jb ac" id="adrvcard_${d.id}"><div class="f ac g8"><span class="pdot ${d.available?'on':'of'}"></span><div><div class="f13 w5">${d.name}</div><div class="f11 tmu">${d.svc||''}</div></div></div><span class="badge ${d.available?'bgr':'bam'}">${d.available?'متاح':'مشغول'}</span></div>`).join('')}
    </div>`;
    // Position driver dots using real coordinates
    drivers.forEach(d=>{
      if(d.lat&&d.lng){
        const dot=document.getElementById('adot_'+d.id);
        if(dot){const [x,y]=ll2xy(d.lat,d.lng);dot.style.left=x+'%';dot.style.top=y+'%';}
      }
    });
  });
}

window.adminDotInfo = async function(id) {
  const d=await sbGetUser(id);if(!d)return;
  const tt=document.getElementById('amtt'),dot=document.getElementById('adot_'+id);
  if(!tt||!dot)return;
  tt.innerHTML=`<strong>${d.name}</strong><br><span class="tmu">${d.svc||''} · ⭐${d.rating||4.8} · ${d.trips||0} رحلة</span><br><span class="badge ${d.available?'bgr':'bam'}">${d.available?'متاح':'مشغول'}</span>`;
  tt.style.display='block';tt.style.top=(parseFloat(dot.style.top)+3)+'%';tt.style.left=(parseFloat(dot.style.left)+2)+'%';
  setTimeout(()=>tt.style.display='none',3000);
};

window.getAdminGPS = function(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude,lng=p.coords.longitude;
    const pin=document.getElementById('adminmepin');if(!pin)return;
    pin.style.display='block';const [x,y]=ll2xy(lat,lng);pin.style.left=x+'%';pin.style.top=y+'%';
    toast('📍 '+lat.toFixed(4)+'، '+lng.toFixed(4));
  });
};

function buildAdminReqs(pc) {
  sbGetRequests().then(reqs=>{
    pc.innerHTML=`<div class="slbl">جميع الطلبات (${reqs.length})</div>`;
    if(!reqs.length){pc.innerHTML+='<div class="f12 tmu tc" style="padding:40px;">لا توجد طلبات</div>';return;}
    const wrap=document.createElement('div');wrap.style.overflowX='auto';
    const sm={pending:'bre انتظار',assigned:'bbl نشط',completed:'bgr مكتمل',cancelled:'bam ملغي'};
    wrap.innerHTML=`<table class="tbl"><thead><tr><th>العميل</th><th>الخدمة</th><th>الموقع</th><th>الدفع</th><th>المبلغ</th><th>الحالة</th><th>السائق</th><th>إجراء</th></tr></thead><tbody>
      ${reqs.map(r=>{
        const [c,t]=(sm[r.status]||'bam انتظار').split(' ');
        return `<tr><td><div class="f13 w5">${r.client_name}</div></td><td>${r.icon||'🔧'} ${r.svc}</td><td class="f12 tmu">${r.addr||'—'}</td><td class="f12">${r.pay==='cash'?'💵':'💳'}</td><td class="tgr w5">${r.price}ر</td><td><span class="badge ${c}">${t}</span></td><td class="f12">${r.driver_name||'—'}</td><td>${r.status==='pending'?`<button class="btn bor2 bsm" onclick="asgn('${r.id}')">تعيين</button>`:'—'}</td></tr>`;
      }).join('')}
    </tbody></table>`;
    pc.appendChild(wrap);
  });
}

window.asgn = async function(reqId) {
  const drivers=await sbGetDrivers();
  const avail=drivers.find(d=>d.available);
  if(!avail){toast('لا يوجد سائق متاح');return;}
  await sbUpdateRequest(reqId,{status:'assigned',driver_id:avail.id,driver_name:avail.name});
  await sbUpdateUser(avail.id,{available:false,current_req_id:reqId});
  toast('تم تعيين '+avail.name);adminNav('requests');
};

function buildAdminDrivers(pc) {
  sbGetDrivers().then(drivers=>{
    pc.innerHTML=`<div class="f jb ac mb16"><div class="slbl" style="margin:0;">السائقون (${drivers.length})</div><button class="btn bor2 bsm" onclick="addDrvModal()"><i class="ti ti-plus"></i> إضافة</button></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;">
      ${drivers.map(d=>`<div class="card fi"><div class="f jb ac mb12">
        <div class="f ac g12"><div class="av av44 avgr">${d.name[0]}</div><div><div class="f14 w5">${d.name}</div><div class="f11 tmu">${d.svc||''} · ${d.plate||''}</div></div></div>
        <span class="badge ${d.available?'bgr':'bam'}">${d.available?'متاح':'مشغول'}</span></div>
        <div class="csm mb10"><div class="f jb mb4"><span class="f11 tmu">البريد</span><span class="f11">${d.email}</span></div><div class="f jb mb4"><span class="f11 tmu">الجوال</span><span class="f11">${d.phone||'—'}</span></div><div class="f jb mb4"><span class="f11 tmu">الرحلات</span><span class="f11 tgr">${d.trips||0}</span></div><div class="f jb"><span class="f11 tmu">التقييم</span><span class="f11 tam">⭐${d.rating||4.8}</span></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;"><button class="btn bdk bsm" onclick="editDrv('${d.id}')"><i class="ti ti-edit"></i> تعديل</button><button class="btn bre2 bsm" onclick="delDrv('${d.id}')"><i class="ti ti-trash"></i> حذف</button></div>
      </div>`).join('')}
    </div>`;
  });
}

window.editDrv = function(id){
  sbGetUser(id).then(d=>{
    if(!d)return;
    const pc=document.getElementById('apc');
    const ov=document.createElement('div');ov.className='modal-ov open fi';
    ov.innerHTML=`<div class="modal"><div class="f16 w7 mb16">تعديل بيانات السائق</div>
      <div class="mb10"><div class="lbl">الاسم</div><input class="inp" id="eda" value="${d.name}"></div>
      <div class="mb10"><div class="lbl">الجوال</div><input class="inp" id="edb" value="${d.phone||''}"></div>
      <div class="mb10"><div class="lbl">الخدمة</div><select class="inp" id="edc">${['سطحة','إطارات','بطارية','وقود','ميكانيك','قفل السيارة'].map(s=>`<option ${d.svc===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="mb16"><div class="lbl">اللوحة</div><input class="inp" id="edd" value="${d.plate||''}"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><button class="btn bdk" onclick="this.closest('.modal-ov').remove()">إلغاء</button><button class="btn bor2" onclick="saveEditDrv('${id}',this)">حفظ</button></div>
    </div>`;pc.appendChild(ov);
  });
};
window.saveEditDrv = async function(id,btn){
  await sbUpdateUser(id,{name:document.getElementById('eda').value.trim(),phone:document.getElementById('edb').value.trim(),svc:document.getElementById('edc').value,plate:document.getElementById('edd').value.trim()});
  btn.closest('.modal-ov').remove();toast('تم التحديث ✓');adminNav('drivers');
};
window.delDrv = async function(id){
  if(!confirm('هل تريد حذف هذا السائق؟'))return;
  await sbDeleteUser(id);toast('تم الحذف');adminNav('drivers');
};
window.addDrvModal = function(){
  const pc=document.getElementById('apc');
  const ov=document.createElement('div');ov.className='modal-ov open fi';
  ov.innerHTML=`<div class="modal"><div class="f16 w7 mb16">إضافة سائق جديد</div>
    <div class="mb10"><div class="lbl">الاسم</div><input class="inp" id="nda"></div>
    <div class="mb10"><div class="lbl">البريد</div><input class="inp" id="ndb" type="email" style="direction:ltr;text-align:left;"></div>
    <div class="mb10"><div class="lbl">كلمة المرور</div><input class="inp" id="ndc" type="password" style="direction:ltr;text-align:left;"></div>
    <div class="mb10"><div class="lbl">الجوال</div><input class="inp" id="ndd"></div>
    <div class="mb10"><div class="lbl">الخدمة</div><select class="inp" id="nde">${['سطحة','إطارات','بطارية','وقود','ميكانيك','قفل السيارة'].map(s=>`<option>${s}</option>`).join('')}</select></div>
    <div class="mb16"><div class="lbl">اللوحة</div><input class="inp" id="ndf"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><button class="btn bdk" onclick="this.closest('.modal-ov').remove()">إلغاء</button><button class="btn bor2" onclick="saveNewDrv(this)">إضافة</button></div>
  </div>`;pc.appendChild(ov);
};
window.saveNewDrv = async function(btn){
  const n=document.getElementById('nda').value.trim(),e=document.getElementById('ndb').value.trim(),p=document.getElementById('ndc').value;
  if(!n||!e){toast('يرجى تعبئة الحقول المطلوبة');return;}
  btn.textContent='جارٍ...';btn.disabled=true;
  try{
    await sbRegister({name:n,email:e,password:p,phone:document.getElementById('ndd').value.trim(),svc:document.getElementById('nde').value,plate:document.getElementById('ndf').value.trim(),role:'driver',rating:5.0,trips:0,available:true,lat:21.4858,lng:39.1925});
    btn.closest('.modal-ov').remove();toast('تم الإضافة ✓');adminNav('drivers');
  }catch(err){btn.textContent='إضافة';btn.disabled=false;toast('البريد مسجل مسبقاً');}
};

function buildAdminClients(pc){
  sbGetClients().then(clients=>{
    pc.innerHTML=`<div class="slbl">العملاء (${clients.length})</div><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>الاسم</th><th>البريد</th><th>الجوال</th><th>التقييم</th><th>إجراء</th></tr></thead><tbody>
      ${clients.map(c=>`<tr><td><div class="f ac g8"><div class="av av36 avbl">${c.name[0]}</div><span class="f13">${c.name}</span></div></td><td class="f12 tmu">${c.email}</td><td class="f12">${c.phone||'—'}</td><td>⭐${c.rating||5.0}</td><td><button class="btn bre2 bsm" onclick="delCli('${c.id}')"><i class="ti ti-trash"></i></button></td></tr>`).join('')}
    </tbody></table></div>`;
  });
}
window.delCli = async function(id){if(!confirm('حذف هذا العميل؟'))return;await sbDeleteUser(id);toast('تم الحذف');adminNav('clients');};

function buildAdminProfile(pc){
  const u=S.user;
  pc.innerHTML=`<div class="card tc mb16 fi" style="padding:24px;max-width:400px;"><div class="av av60 avpu" style="margin:0 auto 14px;">${u.name[0]}</div><div class="f18 w7 mb4">${u.name}</div><div class="f12 tmu mb8">${u.email}</div><span class="badge bor">مشرف النظام</span></div>
  <div class="card mb14" style="max-width:400px;"><div class="slbl">تعديل البيانات</div>
    <div class="mb10"><div class="lbl">الاسم</div><input class="inp" id="apn" value="${u.name}"></div>
    <div class="mb10"><div class="lbl">الجوال</div><input class="inp" id="app" value="${u.phone||''}"></div>
    <div class="mb14"><div class="lbl">كلمة مرور جديدة</div><input class="inp" id="apw" type="password" style="direction:ltr;text-align:left;"></div>
    <button class="btn bor2 bfw" onclick="saveAdmin()">حفظ التغييرات</button>
  </div>`;
}
window.saveAdmin = async function(){
  const p={name:document.getElementById('apn').value.trim(),phone:document.getElementById('app').value.trim()};
  const pw=document.getElementById('apw').value;if(pw)p.password=pw;
  await sbUpdateUser(S.user.id,p);S.user={...S.user,...p};saveSession();toast('تم الحفظ ✓');
};

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{
    if(loadSession()) render();
    else renderChoice(document.getElementById('app-root'));
  }, 600);
});
</script>
</body>
